syntax = "proto3";

package xtopus.api.system.v1;

option go_package = "go.xbrother.com/nix-operator/api/system/v1";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// 统一系统配置服务
service SystemConfigService {
  // 获取所有资源配置
  rpc ListResourceConfigs(ListResourceConfigsRequest) returns (ListResourceConfigsResponse) {
    option (google.api.http) = {
      get: "/v1/resources"
    };
  }
  
  // 获取资源配置
  rpc GetResourceConfig(GetResourceConfigRequest) returns (Resource) {
    option (google.api.http) = {
      get: "/v1/resources/{name}"
    };
  }
  
  // 更新资源配置
  rpc UpdateResourceConfig(UpdateResourceConfigRequest) returns (Resource) {
    option (google.api.http) = {
      put: "/v1/resources/{name}"
      body: "*"
    };
  }
}

// 资源配置
message ResourceConfig {
  string api_version = 1;
  string kind = 2;  // HostsConfiguration, TimeConfiguration, NetworkConfiguration
  Metadata metadata = 3;
  google.protobuf.Any spec = 4;  // 使用Any类型支持强类型
}

// 具体的配置类型定义
message HostsConfigurationSpec {
  repeated HostsConfiguration configurations = 1;
}

message TimeConfigurationSpec {
  string timezone = 1;
  bool ntp_enabled = 2;
  repeated string ntp_servers = 3;
}


// 保留原有的具体类型定义
message HostsConfiguration {
  NodeSelector node_selector = 1;
  string hostname = 2;
  repeated HostEntry hosts = 3;
}

// Hosts条目
message HostEntry {
  // IP地址
  string ip = 1;
  
  // 主机名列表
  repeated string hostnames = 2;
}

// 节点选择器
message NodeSelector {
  // 机器ID匹配
  string machine_id = 1 [json_name="machineId"];
  
  // IP地址匹配
  string ip = 2 [json_name="ip"];
}

message Metadata {
  string name = 1;
  string resource_version = 2;
  int32 generation = 3;
  string creation_time = 4;
  string deletion_time = 5;
  map<string, string> labels = 6;
  map<string, string> annotations = 7;
}

message ResourceStatus {
  // 当前阶段
  string phase = 1;

  // 原因
  string reason = 2;

  // 消息
  string message = 3;

  // 最后同步时间
  google.protobuf.Timestamp last_reconcile_time = 4;
}

message Resource {
  ResourceConfig config = 1;
  ResourceConfig effective_config = 2;
  ResourceStatus status = 3;
}

message ListResourceConfigsRequest {
  string kind = 1;
}

message ListResourceConfigsResponse {
  repeated Resource resources = 1;
}

message GetResourceConfigRequest {
  string name = 1;
}

message UpdateResourceConfigRequest {
  string name = 1;
  Resource resource = 2;
}
