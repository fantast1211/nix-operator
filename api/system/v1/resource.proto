syntax = "proto3";

package xtopus.api.system.v1;

option go_package = "go.xbrother.com/nix-operator/api/system/v1";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// 统一系统配置服务
service SystemConfigService {
  // 获取所有资源配置
  rpc ListResourceConfigs(ListResourceConfigsRequest) returns (ListResourceConfigsResponse) {
    option (google.api.http) = {
      get: "/v1/resources"
    };
  }
  
  // 获取资源配置
  rpc GetResourceConfig(GetResourceConfigRequest) returns (ResourceConfig) {
    option (google.api.http) = {
      get: "/v1/resources/{name}"
    };
  }
  
  // 更新资源配置
  rpc UpdateResourceConfig(UpdateResourceConfigRequest) returns (ResourceConfig) {
    option (google.api.http) = {
      put: "/v1/resources/{name}"
      body: "*"
    };
  }
  
  // 获取资源 JSON Schema
  rpc GetResourceSchemas(GetResourceSchemasRequest) returns (GetResourceSchemasResponse) {
    option (google.api.http) = {
      get: "/v1/schemas"
    };
  }
}

// 资源配置
message ResourceConfig {
  string api_version = 1;
  string kind = 2;  // HostsConfiguration, TimeConfiguration, NetworkConfiguration
  Metadata metadata = 3;
  google.protobuf.Any spec = 4;  // 使用Any类型支持强类型
  ResourceStatus status = 5;  // 资源状态
}

message Metadata {
  string name = 1;
  string resource_version = 2;
  int32 generation = 3;
  string creation_time = 4;
  string deletion_time = 5;
  map<string, string> labels = 6;
  map<string, string> annotations = 7;
}

message ResourceStatus {
  // 当前阶段
  string phase = 1;

  // 原因
  string reason = 2;

  // 消息
  string message = 3;

  // 上次成功调谐的配置generation
  int32 observed_generation = 4;
}

// 废弃的Resource消息，已被ResourceConfig替代
// message Resource {
//   ResourceConfig config = 1;
//   ResourceConfig effective_config = 2;
//   ResourceStatus status = 3;
// }

message ListResourceConfigsRequest {
  string kind = 1;
}

message ListResourceConfigsResponse {
  repeated ResourceConfig resources = 1;
}

message GetResourceConfigRequest {
  string name = 1;
}

message UpdateResourceConfigRequest {
  string name = 1;
  ResourceConfig config = 2;
}

message GetResourceSchemasRequest {
  string kind = 1; // 可选，用于筛选特定类型的 schema
}

message GetResourceSchemasResponse {
  repeated ResourceSchema schemas = 1;
}

message ResourceSchema {
  string kind = 1;          // 资源类型标识
  string display_name = 2;  // 用于展示的中文名
  string version = 3;       // 当前 schema 的版本
  string type_url = 4;      // Any 类型的 typeUrl
  string json_schema = 5;   // 嵌入式返回的 JSON Schema
}
