syntax = "proto3";

package xtopus.api.system.v1;

option go_package = "go.xbrother.com/nix-operator/api/system/v1";

// 节点选择器
message NodeSelector {
  // 机器ID匹配
  string machine_id = 1 [json_name="machineId"];
  
  // IP地址匹配
  string ip = 2 [json_name="ip"];
}



// 网络相关配置定义

// 网络接口配置项
message NetworkInterfaceSpec {
  // 接口名称（如 eth0, enp0s3）
  string name = 1;

  // IPv4 地址
  string ipv4_address = 2 [json_name = "ipAddress"];

  // IPv6 地址
  string ipv6_address = 3 [json_name = "ipv6Address"];

  // IPv4 网关
  string ipv4_gateway = 4 [json_name = "gateway"];

  // IPv6 网关
  string ipv6_gateway = 5 [json_name = "ipv6Gateway"];

  // MTU 设置（最大传输单元）
  int32 mtu = 6;

  // DNS 服务器列表
  repeated string nameservers = 7;
}

// 多接口网络配置项
message NetworkConfigurationSpec {
  // 节点选择器（用于定位目标节点）
  NodeSelector node_selector = 1;

  // 网络接口列表
  repeated NetworkInterfaceSpec interfaces = 2;
}


// Hosts 配置相关定义

// Hosts 配置项
message HostsConfigurationSpec {
  // 节点选择器
  NodeSelector node_selector = 1;

  // 主机名
  string hostname = 2;

  // hosts 条目列表
  repeated HostEntry hosts = 3;
}

// Hosts 条目
message HostEntry {
  // IP 地址
  string ip = 1;

  // 主机名列表
  repeated string hostnames = 2;
}


// 时间配置相关定义

// 时间配置项
message TimeConfigurationSpec {
  // 时区设置（如 Asia/Shanghai）
  string timezone = 1;

  // NTP 配置
  NtpConfig ntp = 2;
}

// NTP 配置
message NtpConfig {
  // 是否启用 NTP
  bool enable = 1;

  // NTP 服务器列表
  repeated string servers = 2;
}