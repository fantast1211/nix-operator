syntax = "proto3";

package xtopus.api.system.v1;

option go_package = "go.xbrother.com/nix-operator/api/system/v1";

import "google/api/annotations.proto";

// 操作系统配置服务
service SystemService {
  // 获取所有网卡
  rpc ListNetworkInterfaces(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse) {
    option (google.api.http) = {
      get: "/v1/network_interfaces"
    };
  }
  
  // 获取单个网络接口
  rpc GetNetworkInterface(GetNetworkInterfaceRequest) returns (GetNetworkInterfaceResponse) {
    option (google.api.http) = {
      get: "/v1/network_interfaces/{name}"
    };
  }
  
  // 更新网络接口配置
  rpc UpdateNetworkInterface(UpdateNetworkInterfaceRequest) returns (UpdateNetworkInterfaceResponse) {
    option (google.api.http) = {
      put: "/v1/network_interfaces/{name}"
      body: "*"
    };
  }
  
  // 获取所有hosts配置
  rpc ListHostsConfigurations(ListHostsConfigurationsRequest) returns (ListHostsConfigurationsResponse) {
    option (google.api.http) = {
      get: "/v1/hosts_configurations"
    };
  }
  
  // 更新hosts配置
  rpc UpdateHostsConfiguration(UpdateHostsConfigurationRequest) returns (UpdateHostsConfigurationResponse) {
    option (google.api.http) = {
      put: "/v1/hosts_configurations/{name}"
      body: "*"
    };
  }
}

message ListNetworkInterfacesRequest {
  // 是否只列出本地网卡
  bool local_only = 1;
}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface interfaces = 1;
}

// 网络接口配置
message NetworkInterface {
  // 节点选择器
  NodeSelector node_selector = 1;
  
  // 接口名称，如 eth0, ens33
  string name = 2;
  
  // IPv4 配置
  IPv4Config ipv4 = 3;
  
  // IPv6 配置
  IPv6Config ipv6 = 4;
  
  // MTU 大小
  int32 mtu = 5;
  
  // MAC 地址
  string mac_address = 6;
  
  // 接口状态
  InterfaceStatus status = 7;
}

// IPv4 配置
message IPv4Config {
  // IP 地址和子网掩码，如 192.168.1.100/24
  string address = 1;
  
  // 网关地址
  string gateway = 2;
  
  // 是否启用 DHCP
  bool dhcp_enabled = 3;
}

// IPv6 配置
message IPv6Config {
  // IPv6 地址和前缀长度，如 2001:db8::1/64
  string address = 1;
  
  // IPv6 网关
  string gateway = 2;
  
  // 是否启用 SLAAC
  bool slaac_enabled = 3;
}

// 接口状态
enum InterfaceStatus {
  Unknown = 0;
  Up = 1;
  Down = 2;
}

// 节点选择器
message NodeSelector {
  // 机器ID匹配
  string machine_id = 1 [json_name="machineId"];
  
  // IP地址匹配
  string ip = 2 [json_name="ip"];
}

// 获取网络接口请求
message GetNetworkInterfaceRequest {
  // 接口名称
  string name = 1;
}

// 获取网络接口响应
message GetNetworkInterfaceResponse {
  // 网络接口
  NetworkInterface interface = 1;
}

// 更新网络接口请求
message UpdateNetworkInterfaceRequest {
  // 接口名称
  string name = 1;
  
  // 网络接口配置
  NetworkInterface interface = 2;
}

// 更新网络接口响应
message UpdateNetworkInterfaceResponse {
  // 更新后的网络接口
  NetworkInterface interface = 1;
  
  // 操作状态
  bool success = 2;
  
  // 错误信息，如果有
  string error_message = 3;
}

// Hosts配置相关消息定义

// 获取所有hosts配置请求
message ListHostsConfigurationsRequest {
  // 是否只列出本地配置
  bool local_only = 1;
}

// 获取所有hosts配置响应
message ListHostsConfigurationsResponse {
  repeated HostsConfiguration configurations = 1;
  string name = 2;
}

// Hosts配置项
message HostsConfiguration {
  // 节点选择器
  NodeSelector node_selector = 1;
  
  // 主机名
  string hostname = 2;
  
  // hosts条目列表
  repeated HostEntry hosts = 3;
}

// Hosts条目
message HostEntry {
  // IP地址
  string ip = 1;
  
  // 主机名列表
  repeated string hostnames = 2;
}

// 更新hosts配置请求
message UpdateHostsConfigurationRequest {
  // 配置名称
  string name = 1;
  
  // hosts配置项列表
  repeated HostsConfiguration configuration = 2;
}

// 更新hosts配置响应
message UpdateHostsConfigurationResponse {
  // 更新后的hosts配置项列表
  repeated HostsConfiguration configuration = 1;
  
  // 操作状态
  bool success = 2;
  
  // 错误信息，如果有
  string error_message = 3;

  string name = 4;
}