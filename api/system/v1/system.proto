syntax = "proto3";

package xtopus.api.system.v1;

option go_package = "go.xbrother.com/nix-operator/api/system/v1";

import "google/api/annotations.proto";
import "validate/validate.proto";

// 节点选择器
message NodeSelector {
  // 机器ID匹配
  string machine_id = 1 [json_name="machineId"];
}



// 网络相关配置定义


// 多接口网络配置项
message NetworkConfigurationSpec {
  // 节点选择器（用于定位目标节点）
  NodeSelector node_selector = 1;

  // 网络接口列表
  repeated NetworkInterface interfaces = 2;
}

// 网络接口配置项
message NetworkInterface {

  // 接口名称（如 eth0, enp0s3）
  string name = 1;

  // IPv4 地址
  string ipv4_address = 2 [
    json_name = "ipAddress",
    (validate.rules).string = {
      pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])$"
    }
  ];

  // IPv6 地址
  string ipv6_address = 3 [
    json_name = "ipv6Address",
    (validate.rules).string = {
      pattern: "^[0-9a-fA-F:]{2,39}$"
    }
  ];

  // IPv4 网关
  string ipv4_gateway = 4 [
    json_name = "gateway",
    (validate.rules).string = {
      pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])$"
    }
  ];

  // IPv6 网关
  string ipv6_gateway = 5 [
    json_name = "ipv6Gateway",
    (validate.rules).string = {
      pattern: "^[0-9a-fA-F:]{2,39}$"
    }
  ];

  // MTU 设置（最大传输单元）
  int32 mtu = 6 [
    (validate.rules).int32 = {
      gte: 576,
      lte: 9000
    }
  ];

  // DNS 服务器列表
  repeated string nameservers = 7 [
    (validate.rules).repeated = {
      items: {
        string: {
          pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])$"
        }
      }
    }
  ];

  // 网卡作为 bond 从属配置
  BondingSlaveConfig bonding_slave = 8 [json_name = "bondingSlave"];
}

// 网卡作为 bond 从属配置
message BondingSlaveConfig {
  // 启用 bond 从属模式
  bool enabled = 1;

  // 所属 bond 接口名（如 bond0）
  string master = 2;
}


// Hosts 配置相关定义

// Hosts 配置项
message HostsConfigurationSpec {
  // 节点选择器
  NodeSelector node_selector = 1;

  // 主机名
  string hostname = 2;

  // hosts 条目列表
  repeated HostEntry hosts = 3;
}

// Hosts 条目
message HostEntry {
  // IP 地址
  string ip = 1;

  // 主机名列表
  repeated string hostnames = 2;
}


// 时间配置相关定义

// 时间配置项
message TimeConfigurationSpec {
  // 节点选择器
  NodeSelector node_selector = 1;

  // 时区设置（如 Asia/Shanghai）
  string timezone = 2;

  // NTP 配置
  NtpConfig ntp = 3;
}

// NTP 配置
message NtpConfig {
  // 是否启用 NTP
  bool enable = 1;

  // NTP 服务器列表
  repeated string servers = 2;
}

// Bond配置相关定义

// Bond 接口网络配置
message BondNetworkConfig {
  // IP 地址（支持 CIDR 格式，如 192.168.99.100/24）
  string ip = 1 [
    (validate.rules).string = {
      pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])(\\/([1-9]|[1-2][0-9]|3[0-2]))?$"
    }
  ];

  // IPv4 网关地址
  string gateway = 2 [
    (validate.rules).string = {
      pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])$"
    }
  ];

  // DNS 服务器列表
  repeated string dns_servers = 3 [
    (validate.rules).repeated = {
      items: {
        string: {
          pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])$"
        }
      },
      max_items: 3
    }
  ];

  // MTU 设置（最大传输单元）
  int32 mtu = 4 [
    (validate.rules).int32 = {
      gte: 576,
      lte: 9000
    }
  ];
}

// Bond 高级选项（可选字段）
message BondOptions {

  // 其他可扩展选项（预留）
  map<string, string> extra_options = 3;
}

// Bond 主设备配置项
message BondConfigurationSpec {

  // 节点选择器
  NodeSelector node_selector = 1;  

  // Bond 接口名称（如 bond0）
  string name = 2 [
    (validate.rules).string = {
      pattern: "^[a-zA-Z0-9\\-_.]+$"
    }
  ];

  // 绑定模式，0~7，对应 bonding 模式（建议为1，用户端无感知，其他数字请具体查询bonding模式）
  int32 mode = 3 [
    (validate.rules).int32 = {
      gte: 0,
      lte: 7
    }
  ];

  // 链路监测间隔（单位：毫秒）
  int32 miimon = 4 [
    (validate.rules).int32 = {
      gte: 0,
      lte: 10000
    }
  ];

  // 网络配置（IP、网关、DNS、MTU）
  BondNetworkConfig network = 5;

  // 可选参数（如 downdelay、updelay）
  BondOptions options = 6;
}
